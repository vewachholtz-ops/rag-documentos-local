name: Publicar la app
on:
  push:
    branches: [main]
    paths: ['site/**', 'web/**', 'scripts/**', 'src/**', 'resultados/**', 'interfaz/**', 'uv.lock', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium  # para tests/test_navegador.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/construir_sitio.py --check
      # la versión web de Tesela (site/app/): la interfaz con VITE_WEB=1 y el motor de Python empaquetado
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interfaz/package-lock.json
      - run: npm ci && npm run build
        working-directory: interfaz
        env:
          VITE_WEB: '1'
      - run: uv run python scripts/construir_web.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  publicar:
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
