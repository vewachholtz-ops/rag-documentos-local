name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: interfaz/package-lock.json
      # la interfaz construida (app/) se sube al repositorio: tiene que calzar con su código en interfaz/
      - run: npm ci && npm run build
        working-directory: interfaz
      # la versión web también tiene que compilar (queda en site/app/, que no se sube)
      - run: npm run build
        working-directory: interfaz
        env:
          VITE_WEB: '1'
      - run: |
          if [ -n "$(git status --porcelain -- app/)" ]; then
            git status --short -- app/
            echo "app/ no calza con interfaz/. Corre: cd interfaz && npm ci && npm run build"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium  # para tests/test_navegador.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/construir_sitio.py --check
