[project]
name = "rag-local"
version = "2.0.0"
description = "Tesela: cuadernos, documentos y notas con búsqueda local y consultas con Ollama o una API compatible. Incluye la evaluación histórica del motor Fuente."
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "Vicente Wachholtz Reyes" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pypdf>=6.20.1",
]

[project.scripts]
rag = "rag_local.__main__:main"

[dependency-groups]
dev = [
    "playwright>=1.63.0",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_local"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
